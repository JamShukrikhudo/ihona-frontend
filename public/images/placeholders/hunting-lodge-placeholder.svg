<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Охотничий домик">
<rect width="400" height="300" rx="16" fill="#E9E4D6"/>

<polygon points="0,175 90,70 160,150 230,55 300,145 400,90 400,240 0,240" fill="#8C7A5A" opacity="0.28"/>
<polygon points="0,205 70,150 150,195 240,120 320,190 400,160 400,250 0,250" fill="#6B5D42" opacity="0.24"/>

<rect x="0" y="248" width="400" height="52" fill="#D9C4A3" opacity="0.55"/>
<line x1="0" y1="248" x2="400" y2="248" stroke="#8C5A17" stroke-width="1.5" opacity="0.4"/>

<!-- Pamir poplars (tall, narrow, columnar crown) — not the conical pines
     of an alpine cabin scene; this is the tree that actually lines
     Pamir villages and irrigation channels. -->
<g>
  <rect x="57" y="188" width="7" height="34" fill="#5F4632"/>
  <ellipse cx="60.5" cy="150" rx="15" ry="66" fill="#5C8A4A"/>
  <ellipse cx="60.5" cy="150" rx="9" ry="58" fill="#71A05C" opacity="0.85"/>

  <rect x="333" y="196" width="6" height="28" fill="#5F4632"/>
  <ellipse cx="336" cy="164" rx="12" ry="54" fill="#5C8A4A"/>
  <ellipse cx="336" cy="164" rx="7" ry="47" fill="#71A05C" opacity="0.85"/>

  <rect x="20" y="214" width="5" height="20" fill="#5F4632"/>
  <ellipse cx="22.5" cy="192" rx="9" ry="40" fill="#5C8A4A" opacity="0.9"/>
</g>

<!-- Памирский дом: flat earthen roof with the traditional stepped
     chorkhona skylight (рӯзан) — not a peaked log-cabin roof. Thick
     clay/stone walls, carved entrance pillars, minimal small windows
     (the skylight is the house's real light source). -->
<rect x="128" y="156" width="144" height="8" fill="#8C7455"/>
<rect x="132" y="164" width="136" height="66" fill="#C9A876"/>
<rect x="132" y="164" width="136" height="66" fill="none" stroke="#A9895F" stroke-width="1.5" opacity="0.6"/>
<line x1="132" y1="182" x2="268" y2="182" stroke="#B29761" stroke-width="1.5" opacity="0.7"/>
<line x1="132" y1="200" x2="268" y2="200" stroke="#B29761" stroke-width="1.5" opacity="0.7"/>
<line x1="132" y1="218" x2="268" y2="218" stroke="#B29761" stroke-width="1.5" opacity="0.7"/>

<!-- chorkhona: three stacked, shrinking square frames -->
<rect x="168" y="130" width="64" height="20" fill="#9C7F53" stroke="#5F4632" stroke-width="2"/>
<rect x="180" y="111" width="40" height="19" fill="#8C7048" stroke="#5F4632" stroke-width="2"/>
<rect x="190" y="94" width="20" height="17" fill="#2E2115" stroke="#5F4632" stroke-width="2"/>

<!-- entrance: carved wooden pillars flanking the door -->
<rect x="176" y="182" width="7" height="48" fill="#4A3625"/>
<rect x="217" y="182" width="7" height="48" fill="#4A3625"/>
<rect x="183" y="188" width="34" height="42" fill="#2E2115"/>
<rect x="183" y="188" width="34" height="6" fill="#4A3625"/>

<rect x="145" y="178" width="18" height="16" fill="#EFDFB8" stroke="#4A3625" stroke-width="1.4"/>
<rect x="237" y="178" width="18" height="16" fill="#EFDFB8" stroke="#4A3625" stroke-width="1.4"/>
</svg>
